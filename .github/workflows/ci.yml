name: CI - Retrain Credit Scoring Model

on:
  push:
    branches: [main]
    paths:
      - "MLProject/**"
      - ".github/workflows/**"
  workflow_dispatch:

env:
  MLFLOW_TRACKING_URI: file://${{ github.workspace }}/mlruns
  IMAGE_NAME: credit-scoring

jobs:
  retrain-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12.7
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"

      - name: Check Env
        run: |
          python --version
          pip --version
          pwd
          ls -la
          ls -la MLProject

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r MLProject/requirements.txt

      - name: Run mlflow project
        run: |
          mlflow run MLProject --env-manager=local

      - name: Get latest MLflow run_id
        run: |
          RUN_ID=$(python -c "
          from mlflow.tracking import MlflowClient
          client = MlflowClient()
          experiment_ids = [e.experiment_id for e in client.search_experiments()]
          runs = client.search_runs(experiment_ids, order_by=['attributes.start_time DESC'], max_results=1)
          print(runs[0].info.run_id)
          ")
          echo "Run ID terbaru: $RUN_ID"
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"

      - name: Upload MLflow artifacts to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: mlruns
          path: mlruns

      # `mlflow models build-docker` (MLflow 2.19.0) gagal karena template Dockerfile-nya memakai
      # Python 3.9 dengan get-pip.py terbaru, sehingga image dibangun dari Dockerfile yang dibuat di sini.
      - name: Build Docker Model
        run: |
          MODEL_DIR=$(python -c "
          import mlflow
          print(mlflow.artifacts.download_artifacts(artifact_uri='runs:/${RUN_ID}/model'))
          " | tail -n 1)
          echo "Direktori model: $MODEL_DIR"
          rm -rf docker-context
          mkdir -p docker-context
          cp -r "$MODEL_DIR" docker-context/model
          cat > docker-context/Dockerfile <<'EOF'
          FROM python:3.12.7-slim
          WORKDIR /opt/ml
          RUN pip install --no-cache-dir mlflow==2.19.0 scikit-learn==1.6.0 pandas==2.2.3 numpy==2.2.1
          COPY model/ /opt/ml/model/
          EXPOSE 8080
          CMD ["mlflow", "models", "serve", "-m", "/opt/ml/model", "-h", "0.0.0.0", "-p", "8080", "--env-manager", "local"]
          EOF
          docker build -t "${IMAGE_NAME}" docker-context

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag Docker Image
        run: |
          docker tag "${IMAGE_NAME}" "${{ secrets.DOCKERHUB_USERNAME }}/${IMAGE_NAME}:latest"
          docker tag "${IMAGE_NAME}" "${{ secrets.DOCKERHUB_USERNAME }}/${IMAGE_NAME}:${{ github.run_number }}"

      - name: Push Docker Image
        run: |
          docker push --all-tags "${{ secrets.DOCKERHUB_USERNAME }}/${IMAGE_NAME}"
