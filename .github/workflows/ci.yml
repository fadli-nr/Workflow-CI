name: CI - Retrain Credit Scoring Model

on:
  push:
    branches: [main]
    paths:
      - "MLProject/**"
      - ".github/workflows/**"
  workflow_dispatch:

env:
  # Semua perintah MLflow memakai penyimpanan lokal yang sama di workspace runner
  MLFLOW_TRACKING_URI: file://${{ github.workspace }}/mlruns
  IMAGE_NAME: credit-scoring

jobs:
  retrain-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12.7
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"

      - name: Check Env
        run: |
          python --version
          pip --version
          pwd
          ls -la
          ls -la MLProject

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r MLProject/requirements.txt

      - name: Run mlflow project
        run: |
          mlflow run MLProject --env-manager=local

      - name: Get latest MLflow run_id
        run: |
          RUN_ID=$(python -c "
          from mlflow.tracking import MlflowClient
          client = MlflowClient()
          experiment_ids = [e.experiment_id for e in client.search_experiments()]
          runs = client.search_runs(experiment_ids, order_by=['attributes.start_time DESC'], max_results=1)
          print(runs[0].info.run_id)
          ")
          echo "Run ID terbaru: $RUN_ID"
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"

      - name: Upload MLflow artifacts to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: mlruns
          path: mlruns

      - name: Build Docker Model
        run: |
          mlflow models build-docker -m "runs:/${RUN_ID}/model" -n "${IMAGE_NAME}"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag Docker Image
        run: |
          docker tag "${IMAGE_NAME}" "${{ secrets.DOCKERHUB_USERNAME }}/${IMAGE_NAME}:latest"
          docker tag "${IMAGE_NAME}" "${{ secrets.DOCKERHUB_USERNAME }}/${IMAGE_NAME}:${{ github.run_number }}"

      - name: Push Docker Image
        run: |
          docker push --all-tags "${{ secrets.DOCKERHUB_USERNAME }}/${IMAGE_NAME}"
